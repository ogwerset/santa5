<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101217">
<meta name="description" content="City Bloxxx - przeglądarkowy remake klasyka z telefonów Nokia. Buduj wieżę, łap perfekcyjne zrzuty.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bloxxx">
<title>City Bloxxx</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="phone" id="phone">
    <div class="top">
      <div class="earpiece"></div>
      <div class="brand">BLOXXX</div>
    </div>

    <div class="bezel">
      <canvas id="screen" width="176" height="208" aria-label="City Bloxxx"></canvas>
      <div class="glare"></div>
    </div>

    <div class="nav">
      <div class="side">
        <button class="soft" data-action="ok" data-key="lsk" aria-label="Lewy klawisz"><i></i></button>
        <button class="call green" data-action="ok" data-key="call" aria-label="Zielona słuchawka"><i></i></button>
      </div>
      <div class="dpad">
        <button class="d up" data-action="up" data-key="up" aria-label="Góra"></button>
        <button class="d right" data-action="right" data-key="right" aria-label="Prawo"></button>
        <button class="d down" data-action="down" data-key="down" aria-label="Dół"></button>
        <button class="d left" data-action="left" data-key="left" aria-label="Lewo"></button>
        <button class="d ok" data-action="ok" data-key="ok" aria-label="OK"></button>
      </div>
      <div class="side">
        <button class="soft" data-action="back" data-key="rsk" aria-label="Prawy klawisz"><i></i></button>
        <button class="call red" data-action="back" data-key="end" aria-label="Czerwona słuchawka"><i></i></button>
      </div>
    </div>

    <div class="keypad">
      <button data-action="none" data-key="1"><b>1</b><s>o_o</s></button>
      <button data-action="up" data-key="2"><b>2</b><s>abc</s></button>
      <button data-action="none" data-key="3"><b>3</b><s>def</s></button>
      <button data-action="left" data-key="4"><b>4</b><s>ghi</s></button>
      <button data-action="ok" data-key="5" class="nub"><b>5</b><s>jkl</s></button>
      <button data-action="right" data-key="6"><b>6</b><s>mno</s></button>
      <button data-action="none" data-key="7"><b>7</b><s>pqrs</s></button>
      <button data-action="down" data-key="8"><b>8</b><s>tuv</s></button>
      <button data-action="none" data-key="9"><b>9</b><s>wxyz</s></button>
      <button data-action="none" data-key="*"><b>*</b><s>+</s></button>
      <button data-action="none" data-key="0"><b>0</b><s>&#9251;</s></button>
      <button data-action="mute" data-key="#"><b>#</b><s>&#9835;</s></button>
    </div>
  </div>
  <p class="hint">SPACJA / 5 / TAP = zrzut &middot; ESC = pauza &middot; M = dźwięk</p>
</div>
<script src="game.js"></script>
</body>
</html>
